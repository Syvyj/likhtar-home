name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK уже є на раннері; дія лише приймає ліцензії. Без `packages` вона ставила б пакет
      # `tools`, якого Google більше не публікує, і збірка падала, не почавшись.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assemblePlayDebug

      - name: Unit tests
        run: ./gradlew testPlayDebugUnitTest

      - name: Lint
        run: ./gradlew lintPlayDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: likhtar-debug-apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
