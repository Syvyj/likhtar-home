<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#27231E">
<title>Передати на ТБ</title>
<!-- «Передати на приставку» (PhoneDrop): файл — сирим тілом POST …/upload?name=, з прогресом;
     посилання — POST …/link. Сторінку віддає сама приставка, тож шляхи відносні. -->
<style>
  :root { --bg:#27231E; --card:#302C25; --line:#3A352C; --text:#F4ECDF; --muted:#A8A196; --amber:#F2A93B; --glow:#FFD27A; --bad:#E07A5F; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:22px 16px 40px; }
  h1 { margin:0 0 4px; font-size:23px; font-weight:650; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 22px; }
  .pick { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:18px; border-radius:16px;
          background:var(--amber); color:#27231E; font-size:18px; font-weight:650; cursor:pointer; }
  .pick input { display:none; }
  .free { color:var(--muted); font-size:13px; margin:10px 2px 0; }
  ul { list-style:none; margin:18px 0 0; padding:0; }
  li { background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .row { display:flex; justify-content:space-between; gap:10px; font-size:15px; }
  .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pct { color:var(--muted); flex:none; font-variant-numeric:tabular-nums; }
  .bar { height:4px; border-radius:2px; background:var(--line); margin-top:9px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--amber); transition:width .2s; }
  li.ok .pct { color:var(--glow); }
  li.bad .pct { color:var(--bad); }
  h2 { font-size:15px; font-weight:600; color:var(--muted); margin:28px 0 8px; }
  .link { display:flex; gap:8px; }
  .link input { flex:1; min-width:0; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:12px;
                padding:13px 14px; font-size:16px; outline:none; }
  .link input:focus { border-color:var(--amber); }
  .link button { border:0; border-radius:12px; padding:0 16px; background:var(--card); color:var(--glow); font:inherit; font-weight:600; border:1px solid var(--line); }
  .note { color:var(--muted); font-size:13px; margin-top:8px; min-height:18px; }
</style>
</head>
<body>
<main>
  <h1 data-t="title"></h1>
  <p class="sub" data-t="sub"></p>
  <label class="pick"><span data-t="pick"></span><input id="files" type="file" multiple></label>
  <div class="free" id="free"></div>
  <ul id="list"></ul>
  <h2 data-t="or"></h2>
  <form class="link" id="linkForm">
    <input id="url" type="url" inputmode="url" placeholder="https://youtu.be/…" autocomplete="off">
    <button type="submit" data-t="open"></button>
  </form>
  <div class="note" id="note"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
// Мова сторінки — мова телефона: українська або англійська.
const T = /^uk/i.test(navigator.language) ? {
  title: 'Передати на телевізор',
  sub: 'Відео, фото чи APK — приставка запропонує, що з ним зробити. Усе лягає в «Завантаження → Likhtar» на приставці. Цю сторінку можна зберегти в закладки.',
  pick: 'Вибрати файли', or: 'Або посилання', open: 'Відкрити', gb: 'ГБ', mb: 'МБ',
  free: 'Вільно на приставці: ', done: 'на ТБ', error: 'помилка', lost: 'зв\'язок обірвався', waits: 'чекає',
  need_link: 'Вставте посилання, що починається з https://', sent: 'Готово — підтвердіть на телевізорі', not_sent: 'Не вдалося передати',
  not_link: 'Це не посилання', no_size: 'Невідомий розмір', no_space: 'не вистачає місця', busy: 'Приставка вже приймає файл',
  no_file: 'Не вдалося створити файл', cut: 'Передачу перервано',
} : {
  title: 'Send to the TV',
  sub: 'A video, a photo or an APK — the TV box will offer what to do with it. Everything lands in “Downloads → Likhtar” on the box. You can bookmark this page.',
  pick: 'Choose files', or: 'Or a link', open: 'Open', gb: 'GB', mb: 'MB',
  free: 'Free on the TV box: ', done: 'on the TV', error: 'error', lost: 'connection lost', waits: 'waiting',
  need_link: 'Paste a link that starts with https://', sent: 'Done — confirm on the TV', not_sent: 'Could not send',
  not_link: 'Not a link', no_size: 'Unknown size', no_space: 'not enough space', busy: 'The TV box is already receiving a file',
  no_file: 'Could not create the file', cut: 'Transfer interrupted',
};
document.title = T.title;
document.documentElement.lang = /^uk/i.test(navigator.language) ? 'uk' : 'en';
document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[el.dataset.t]; });
const size = (b) => b > 1e9 ? (b / 1e9).toFixed(1) + ' ' + T.gb : (b / 1e6).toFixed(b > 1e8 ? 0 : 1) + ' ' + T.mb;
let free = null;

async function refreshFree() {
  try {
    free = (await (await fetch('space', { cache: 'no-store' })).json()).free;
    $('free').textContent = T.free + size(free);
  } catch (_) { $('free').textContent = ''; }
}

function send(file, li) {
  return new Promise((done) => {
    const pct = li.querySelector('.pct'), bar = li.querySelector('i');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'upload?name=' + encodeURIComponent(file.name));
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const p = Math.round(e.loaded / e.total * 100);
      bar.style.width = p + '%'; pct.textContent = p + '%';
    };
    xhr.onload = () => {
      if (xhr.status === 200) { li.className = 'ok'; bar.style.width = '100%'; pct.textContent = T.done; }
      else { li.className = 'bad'; let code = ''; try { code = JSON.parse(xhr.responseText).error; } catch (_) {} pct.textContent = T[code] || T.error; }
      done();
    };
    xhr.onerror = () => { li.className = 'bad'; pct.textContent = T.lost; done(); };
    xhr.send(file);
  });
}

$('files').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  const items = files.map((f) => {
    const li = document.createElement('li');
    li.innerHTML = '<div class="row"><span class="name"></span><span class="pct"></span></div><div class="bar"><i></i></div>';
    li.querySelector('.pct').textContent = T.waits;
    li.querySelector('.name').textContent = f.name + ' · ' + size(f.size);
    $('list').prepend(li);
    return [f, li];
  });
  // По одному: приставка приймає один файл за раз, а диск і так один.
  for (const [f, li] of items) {
    if (free !== null && f.size > free) { li.className = 'bad'; li.querySelector('.pct').textContent = T.no_space; continue; }
    await send(f, li);
    await refreshFree();
  }
});

$('linkForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = $('url').value.trim();
  if (!/^https?:\/\//.test(url)) { $('note').textContent = T.need_link; return; }
  const r = await fetch('link', { method: 'POST', body: url }).catch(() => null);
  $('note').textContent = r && r.ok ? T.sent : T.not_sent;
  if (r && r.ok) $('url').value = '';
});

refreshFree();
</script>
</body>
</html>
